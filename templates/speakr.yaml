$schema: "ianoie-template/v1"

metadata:
  name: "Speakr"
  slug: "speakr"
  version: "1.0.0"
  description: "AI-powered transcription and note-taking platform with speaker identification"
  long_description: |
    Transform audio recordings into organized, searchable notes.
    Supports cloud APIs (OpenAI, Gemini) or local WhisperX (GPU) for transcription.
    Features: smart recording, AI transcription, voice profiles, semantic search, REST API.
  category: "transcription"
  icon: "Mic"
  tags: ["transcription", "audio", "notes", "ai"]

gpu:
  required: false
  min_count: 0
  max_count: 1
  min_vram_gb: 0

llm:
  supported_providers: ["openai", "gemini", "anthropic"]
  connection_env:
    openai:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"
    gemini:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"
    anthropic:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"

config:
  - key: "transcription_connector"
    label: "Transcription Connector"
    type: "select"
    default: "openai_transcribe"
    required: true
    options: ["openai_transcribe", "openai_whisper", "mistral", "vibevoice", "asr_endpoint"]
    description: "openai_* = OpenAI cloud API; mistral / vibevoice = those cloud APIs; asr_endpoint = your own Whisper/ASR server (set URL below)."

  - key: "transcription_api_key"
    label: "API Key (cloud connectors)"
    type: "string"
    default: "sk-replace-with-your-key"
    required: false
    description: "API key for openai/mistral/vibevoice. A placeholder lets it install now; set the real key via Edit config. Ignored when using asr_endpoint."

  - key: "transcription_model"
    label: "Transcription Model"
    type: "string"
    default: "gpt-4o-transcribe-diarize"
    required: false
    description: "gpt-4o-transcribe-diarize (openai_transcribe), whisper-1 (openai_whisper), or your provider's model name."

  - key: "asr_endpoint_url"
    label: "ASR Endpoint URL (asr_endpoint only)"
    type: "string"
    default: ""
    required: false
    description: "Your Whisper/ASR server URL, e.g. http://192.168.1.50:9000. Used only when connector = asr_endpoint."

  - key: "admin_email"
    label: "Admin Email"
    type: "string"
    default: "admin@example.com"
    required: true
    description: "Email you'll use to log in to Speakr. The admin account is created with this on first launch."

  - key: "admin_password"
    label: "Admin Password"
    type: "string"
    default: "admin"
    required: true
    description: "Initial admin password (shown masked). Change it inside Speakr after your first login."

access:
  url: "/app/{installation_id}/"
  credentials:
    - label: "Email"
      value: "{{config.admin_email}}"
    - label: "Password"
      value: "{{config.admin_password}}"
  note: "Change the password after your first login."

services:
  speakr:
    image: "learnedmachine/speakr"
    tag: "latest"
    internal: false

    environment:
      TRANSCRIPTION_CONNECTOR: "{{config.transcription_connector}}"
      TRANSCRIPTION_API_KEY: "{{config.transcription_api_key}}"
      TRANSCRIPTION_MODEL: "{{config.transcription_model}}"
      ASR_BASE_URL: "{{config.asr_endpoint_url}}"
      ASR_RETURN_SPEAKER_EMBEDDINGS: "true"
      ADMIN_USERNAME: "admin"
      ADMIN_EMAIL: "{{config.admin_email}}"
      ADMIN_PASSWORD: "{{config.admin_password}}"
      ALLOW_REGISTRATION: "false"
      ENABLE_INQUIRE_MODE: "true"
      LOG_LEVEL: "ERROR"
      SQLALCHEMY_DATABASE_URI: "sqlite:////data/instance/transcriptions.db"

    ports:
      - container_port: 8899
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "speakr-uploads"
        mount_path: "/data/uploads"
        mode: "rw"
      - name: "speakr-instance"
        mount_path: "/data/instance"
        mode: "rw"

    gpu:
      enabled: false

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8899/health || exit 1"]
      interval: 30
      timeout: 10
      retries: 5
      start_period: 60

    restart: "unless-stopped"

    resource_limits:
      memory: "4g"
      cpus: 2.0
