$schema: "ianoie-template/v1"

metadata:
  name: "Speakr"
  slug: "speakr"
  version: "1.0.0"
  description: "AI-powered transcription and note-taking platform with speaker identification"
  long_description: |
    Transform audio recordings into organized, searchable notes.
    Supports cloud APIs (OpenAI, Gemini) or local WhisperX (GPU) for transcription.
    Features: smart recording, AI transcription, voice profiles, semantic search, REST API.
  category: "productivity"
  icon: "Mic"
  tags: ["transcription", "audio", "notes", "ai"]

gpu:
  required: false
  min_count: 0
  max_count: 1
  min_vram_gb: 0

llm:
  supported_providers: ["openai", "gemini", "anthropic"]
  connection_env:
    openai:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"
    gemini:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"
    anthropic:
      TEXT_MODEL_API_KEY: "{{llm.api_key}}"
      TEXT_MODEL_NAME: "{{llm.model}}"

config:
  - key: "openai_api_key"
    label: "OpenAI API Key"
    type: "string"
    default: ""
    required: true
    description: "Required — Speakr transcribes via the OpenAI API (gpt-4o-transcribe). Get a key at platform.openai.com."

services:
  speakr:
    image: "learnedmachine/speakr"
    tag: "latest"
    internal: false

    environment:
      TRANSCRIPTION_CONNECTOR: "openai_transcribe"
      TRANSCRIPTION_API_KEY: "{{config.openai_api_key}}"
      TRANSCRIPTION_MODEL: "gpt-4o-transcribe-diarize"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
      ALLOW_REGISTRATION: "false"
      ENABLE_INQUIRE_MODE: "true"
      LOG_LEVEL: "ERROR"
      SQLALCHEMY_DATABASE_URI: "sqlite:////data/instance/transcriptions.db"

    ports:
      - container_port: 8899
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "speakr-uploads"
        mount_path: "/data/uploads"
        mode: "rw"
      - name: "speakr-instance"
        mount_path: "/data/instance"
        mode: "rw"

    gpu:
      enabled: false

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8899/health || exit 1"]
      interval: 30
      timeout: 10
      retries: 5
      start_period: 60

    restart: "unless-stopped"

    resource_limits:
      memory: "4g"
      cpus: 2.0
