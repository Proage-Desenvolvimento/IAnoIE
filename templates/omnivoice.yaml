$schema: "ianoie-template/v1"

metadata:
  name: "OmniVoice"
  slug: "omnivoice"
  version: "0.1.2"
  description: "Zero-shot TTS with voice cloning and voice design for 600+ languages (GPU required)"
  long_description: |
    State-of-the-art text-to-speech model supporting 600+ languages.
    Features: Voice Cloning from 3-10s reference audio, Voice Design with
    speaker attributes (gender, age, pitch, accent, dialect), auto language
    detection, and non-verbal symbols. Built on diffusion language models by
    Xiaomi AI Lab / k2-fsa team.
  category: "voice"
  icon: "AudioLines"
  tags: ["tts", "voice-cloning", "speech", "multilingual", "ai"]

gpu:
  required: true
  min_count: 1
  max_count: 1
  min_vram_gb: 8

config:
  - key: "inference_steps"
    label: "Inference Steps"
    type: "select"
    default: 32
    required: true
    options: [16, 32, 48, 64]
    description: "Higher = better quality but slower. 16 for fast inference, 32 for balanced, 64 for best quality"

  - key: "guidance_scale"
    label: "Guidance Scale (CFG)"
    type: "select"
    default: "2.0"
    required: true
    options: ["1.0", "1.5", "2.0", "2.5", "3.0"]
    description: "Classifier-free guidance scale. Higher = more adherence to prompt. Default 2.0"

  - key: "root_path"
    label: "Reverse Proxy Path (optional)"
    type: "string"
    default: ""
    required: false
    description: "Leave empty for default. Set if behind a reverse proxy with a sub-path."

services:
  omnivoice:
    image: "ianoie/omnivoice"
    tag: "latest"
    internal: false

    # Operator-built image — not in any registry. The worker builds it from this
    # Dockerfile at install/update time (context is repo-root-relative).
    build:
      context: "docker/omnivoice"
      dockerfile: "Dockerfile"

    environment:
      OMNIVOICE_MODEL: "k2-fsa/OmniVoice"
      OMNIVOICE_DEVICE: "cuda"
      OMNIVOICE_PORT: "7860"
      OMNIVOICE_IP: "0.0.0.0"
      OMNIVOICE_ROOT_PATH: "{{config.root_path}}"

    ports:
      - container_port: 7860
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "omnivoice-models"
        mount_path: "/root/.cache/huggingface"
        mode: "rw"

    gpu:
      enabled: true
      count: 1

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/ || exit 1"]
      interval: 30
      timeout: 10
      retries: 10
      start_period: 300

    restart: "unless-stopped"

    resource_limits:
      memory: "16g"
      cpus: 4.0
