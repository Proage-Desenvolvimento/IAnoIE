$schema: "ianoie-template/v1"

metadata:
  name: "RAGFlow"
  slug: "ragflow"
  version: "0.26.1"
  description: "RAG engine with deep document understanding — chunk, embed and chat over complex documents (PDFs, tables, contracts) with grounded citations."
  long_description: |
    RAGFlow is an open-source RAG (Retrieval-Augmented Generation) engine built
    around deep document understanding. It chunks and embeds hard-to-parse
    documents — long PDFs, tables, forms and contracts — and grounds every
    answer in the exact source, with citations you can verify. Stack: the
    RAGFlow web/API container plus MySQL (metadata), Redis (cache), MinIO
    (object storage) and Elasticsearch (vector + full-text search). LLM
    providers (OpenAI, Anthropic, Gemini, Ollama and more) are configured in
    the RAGFlow admin UI after install.
  category: "rag"
  icon: "FileSearch"
  tags: ["llm", "rag", "documents", "search", "citations"]

gpu:
  required: false
  min_count: 0
  max_count: 0
  min_vram_gb: 0

# Sem seção llm: o RAGFlow configura os providers (OpenAI/Anthropic/Gemini/
# Ollama/...) no seu próprio Admin UI após instalar. O provider padrão da
# IAnoIE não é injetado aqui.
#
# NOTA 1 — host kernel: o Elasticsearch exige `vm.max_map_count >= 262144` no
# host, senão ele crasha no boot. Os scripts setup-dgx.sh e setup-vps.sh já
# aplicam esse sysctl; em outro host rode:
#   sudo sysctl -w vm.max_map_count=262144
#
# NOTA 2 — stack pesado: a imagem do RAGFlow é grande (~9GB) e o primeiro boot
# é lento (init do RAGFlow + migrations + ES ficando healthy). Memória total
# dos containers chega a ~16GB (ES ~8GB + RAGFlow ~4GB). Adequado para a DGX
# Spark (128GB) ou VPS com >= 16GB RAM.
#
# NOTA 3 — sem mount de arquivos: o schema ianoie só suporta named volumes, então
# não montamos service_conf.yaml.template / entrypoint.sh / init.sql do upstream.
# A imagem do RAGFlow já traz service_conf.yaml.template + entrypoint.sh embutidos;
# o entrypoint renderiza o service_conf a partir das env vars abaixo (hosts via
# {{services.*}}, secrets via {{config.*}}). O MySQL cria só o DB `rag_flow`
# (MYSQL_DATABASE); o `rag_flow_doc` é criado pelo init_database.py do próprio
# RAGFlow no primeiro boot.

config:
  - key: "mysql_password"
    label: "MySQL Root Password"
    type: "string"
    default: "IanoieRagflowMySQL2024"
    required: true
    description: "Senha do root do MySQL do RAGFlow. Troque em produção."
  - key: "redis_password"
    label: "Redis Password"
    type: "string"
    default: "IanoieRagflowRedis2024"
    required: true
    description: "Senha do Redis (Valkey) do RAGFlow."
  - key: "minio_user"
    label: "MinIO User"
    type: "string"
    default: "rag_flow"
    required: true
    description: "Usuário root do MinIO (object storage)."
  - key: "minio_password"
    label: "MinIO Password"
    type: "string"
    default: "IanoieRagflowMinio2024"
    required: true
    description: "Senha root do MinIO."
  - key: "es_password"
    label: "Elasticsearch Password"
    type: "string"
    default: "IanoieRagflowES2024"
    required: true
    description: "Senha do usuário `elastic` do Elasticsearch."

services:
  mysql:
    image: "mysql"
    tag: "8.0.39"
    internal: true

    environment:
      MYSQL_ROOT_PASSWORD: "{{config.mysql_password}}"
      MYSQL_DATABASE: "rag_flow"
      TZ: "UTC"

    # Flags do upstream, exceto --init-file (não montamos init.sql: o DB principal
    # é pré-criado por MYSQL_DATABASE e o rag_flow_doc pelo init do RAGFlow).
    command:
      - "--max_connections=1000"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
      - "--tls_version=TLSv1.2,TLSv1.3"
      - "--binlog_expire_logs_seconds=604800"

    ports:
      - container_port: 3306
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "ragflow-mysql"
        mount_path: "/var/lib/mysql"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15
      timeout: 10
      retries: 60
      start_period: 60

    restart: "unless-stopped"

  redis:
    image: "valkey/valkey"
    tag: "8"
    internal: true

    command:
      - "redis-server"
      - "--requirepass"
      - "{{config.redis_password}}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"

    environment:
      REDIS_PASSWORD: "{{config.redis_password}}"

    ports:
      - container_port: 6379
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "ragflow-redis"
        mount_path: "/data"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15
      timeout: 5
      retries: 30
      start_period: 20

    restart: "unless-stopped"

  minio:
    image: "minio/minio"
    tag: "RELEASE.2024-10-13T13-34-11Z"
    internal: true

    command:
      - "server"
      - "--console-address"
      - ":9001"
      - "/data"

    environment:
      MINIO_ROOT_USER: "{{config.minio_user}}"
      MINIO_ROOT_PASSWORD: "{{config.minio_password}}"

    ports:
      - container_port: 9000
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "ragflow-minio"
        mount_path: "/data"
        mode: "rw"

    # Imagem minimal (sem curl/bash): confiamos no readiness TCP do worker.
    restart: "unless-stopped"

  elasticsearch:
    image: "elasticsearch"
    tag: "8.11.3"
    internal: true

    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "{{config.es_password}}"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      cluster.routing.allocation.disk.watermark.low: "5gb"
      cluster.routing.allocation.disk.watermark.high: "3gb"
      cluster.routing.allocation.disk.watermark.flood_stage: "2gb"

    ports:
      - container_port: 9200
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "ragflow-es"
        mount_path: "/usr/share/elasticsearch/data"
        mode: "rw"

    resource_limits:
      memory: "8g"

    restart: "unless-stopped"

  ragflow:
    image: "infiniflow/ragflow"
    tag: "v0.26.1"
    internal: false

    # Liga o Admin server e inicializa as tabelas de model providers no boot.
    command:
      - "--enable-adminserver"
      - "--init-model-provider-tables"

    environment:
      # Doc engine fixo em elasticsearch (o schema não suporta profiles).
      DOC_ENGINE: "elasticsearch"
      DEVICE: "cpu"
      # MySQL
      MYSQL_HOST: "{{services.mysql}}"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "{{config.mysql_password}}"
      MYSQL_DBNAME: "rag_flow"
      # MinIO
      MINIO_HOST: "{{services.minio}}"
      MINIO_USER: "{{config.minio_user}}"
      MINIO_PASSWORD: "{{config.minio_password}}"
      # Redis
      REDIS_HOST: "{{services.redis}}"
      REDIS_PASSWORD: "{{config.redis_password}}"
      # Elasticsearch
      ES_HOST: "{{services.elasticsearch}}"
      ES_USER: "elastic"
      ELASTIC_PASSWORD: "{{config.es_password}}"
      # Portas internas do RAGFlow (nginx web na 80 é o que expomos).
      SVR_WEB_HTTP_PORT: "80"
      SVR_WEB_HTTPS_PORT: "443"
      SVR_HTTP_PORT: "9380"
      ADMIN_SVR_HTTP_PORT: "9381"
      TZ: "America/Sao_Paulo"

    ports:
      - container_port: 80
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "ragflow-logs"
        mount_path: "/ragflow/logs"
        mode: "rw"

    resource_limits:
      memory: "4g"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30
      timeout: 10
      retries: 20
      start_period: 300

    restart: "unless-stopped"

    depends_on:
      - "mysql"
      - "redis"
      - "minio"
      - "elasticsearch"
