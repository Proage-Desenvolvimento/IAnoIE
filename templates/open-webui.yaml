$schema: "ianoie-template/v1"

metadata:
  name: "Open WebUI"
  slug: "open-webui"
  version: "1.0.0"
  description: "ChatGPT-style web interface for local and cloud LLMs"
  category: "llm"
  icon: "MessageSquare"
  tags: ["chat", "webui", "llm"]

gpu:
  required: false

llm:
  supported_providers: ["openai", "gemini", "anthropic", "ollama"]
  connection_env:
    openai:
      OPENAI_API_KEY: "{{llm.api_key}}"
      OPENAI_BASE_URL: "{{llm.base_url}}"
      OPENAI_MODEL: "{{llm.model}}"
    gemini:
      GOOGLE_API_KEY: "{{llm.api_key}}"
      GEMINI_MODEL: "{{llm.model}}"
    anthropic:
      ANTHROPIC_API_KEY: "{{llm.api_key}}"
      ANTHROPIC_MODEL: "{{llm.model}}"
    ollama:
      OLLAMA_BASE_URL: "{{llm.base_url}}"
      OLLAMA_MODEL: "{{llm.model}}"

config:
  - key: "ollama_base_url"
    label: "Ollama API URL"
    type: "string"
    default: "http://ollama:11434"
    required: false
    description: "URL of your Ollama instance (optional if using cloud provider)"

services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui"
    tag: "latest"
    internal: false

    environment:
      OLLAMA_BASE_URL: "{{config.ollama_base_url}}"
      WEBUI_AUTH: "false"
      ENV: "prod"

    ports:
      - container_port: 8080
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "openwebui-data"
        mount_path: "/app/backend/data"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -q ok || exit 1"]
      interval: 30
      timeout: 10
      retries: 5
      start_period: 60

    restart: "unless-stopped"
