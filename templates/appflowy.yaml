$schema: "ianoie-template/v1"

metadata:
  name: "AppFlowy"
  slug: "appflowy"
  version: "1.0.0"
  description: "Open-source Notion alternative — self-host the AppFlowy collaboration server (workspaces, wikis, realtime, AI)."
  long_description: |
    AppFlowy Cloud is the self-hostable collaboration backend for AppFlowy, the
    open-source Notion alternative. Run workspaces, wikis, realtime collaboration
    and AI features on your own infrastructure (PostgreSQL + pgvector, Redis,
    MinIO object storage, full-text + semantic search). Open-core: the free tier
    covers 1 user seat + 3 guests. The AppFlowy desktop/mobile client connects to
    this server; a web client is also available.
  category: "docs"
  icon: "Notebook"
  tags: ["productivity", "notes", "wiki", "collaboration"]

gpu:
  required: false
  min_count: 0
  max_count: 0
  min_vram_gb: 0

# OSS só suporta OpenAI/Azure na camada de IA. O provider openai da IAnoIE injeta
# AI_OPENAI_API_KEY no serviço `ai`.
llm:
  supported_providers: ["openai", "openrouter"]
  connection_env:
    openai:
      AI_OPENAI_API_KEY: "{{llm.api_key}}"
    openrouter:
      AI_OPENAI_API_KEY: "{{llm.api_key}}"
      OPENAI_API_BASE: "{{llm.base_url}}"

config:
  - key: "jwt_secret"
    label: "JWT Secret"
    type: "string"
    default: "ianoie-appflowy-jwt-change-me"
    required: true
    description: "Segredo JWT compartilhado entre gotrue/cloud/ai (APPFLOWY_GOTRUE_JWT_SECRET). Gere um valor forte e único."
  - key: "admin_email"
    label: "Admin Email"
    type: "string"
    default: "admin@example.com"
    required: true
    description: "E-mail do admin inicial do GoTrue."
  - key: "admin_password"
    label: "Admin Password"
    type: "string"
    default: "change-me-now"
    required: true
    description: "Senha do admin inicial. Troque após o primeiro login."
  - key: "base_url"
    label: "Public Base URL"
    type: "string"
    default: "http://localhost"
    required: false
    description: "URL pública do servidor AppFlowy (ex.: https://suite.aimization.com)."

services:
  postgres:
    image: "pgvector/pgvector"
    tag: "pg16"
    internal: true

    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "IanoieAppflowyPg2024"
      POSTGRES_DB: "appflowy"

    ports:
      - container_port: 5432
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "appflowy-pg"
        mount_path: "/var/lib/postgresql/data"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15
      timeout: 5
      retries: 15
      start_period: 30

    restart: "unless-stopped"

  redis:
    image: "redis"
    tag: "7-alpine"
    internal: true

    ports:
      - container_port: 6379
        host_port: null
        protocol: "tcp"
        expose: false

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 15
      timeout: 5
      retries: 10
      start_period: 20

    restart: "unless-stopped"

  minio:
    image: "minio/minio"
    tag: "latest"
    internal: true

    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "IanoieMinio2024"

    ports:
      - container_port: 9000
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "appflowy-minio"
        mount_path: "/data"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 20
      timeout: 10
      retries: 10
      start_period: 40

    restart: "unless-stopped"

  gotrue:
    image: "appflowyinc/gotrue"
    tag: "latest"
    internal: true

    environment:
      GOTRUE_JWT_SECRET: "{{config.jwt_secret}}"
      GOTRUE_ADMIN_EMAIL: "{{config.admin_email}}"
      GOTRUE_ADMIN_PASSWORD: "{{config.admin_password}}"
      DATABASE_URL: "postgres://postgres:IanoieAppflowyPg2024@{{services.postgres}}:5432/appflowy?sslmode=disable&search_path=auth"

    ports:
      - container_port: 9999
        host_port: null
        protocol: "tcp"
        expose: false

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9999' || exit 1"]
      interval: 20
      timeout: 10
      retries: 10
      start_period: 40

    restart: "unless-stopped"

    depends_on:
      - "postgres"

  ai:
    image: "appflowyinc/appflowy_ai"
    tag: "latest"
    internal: true

    ports:
      - container_port: 5001
        host_port: null
        protocol: "tcp"
        expose: false

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5001' || exit 1"]
      interval: 20
      timeout: 10
      retries: 10
      start_period: 40

    restart: "unless-stopped"

  appflowy_worker:
    image: "appflowyinc/appflowy_worker"
    tag: "latest"
    internal: true

    environment:
      APPFLOWY_GOTRUE_JWT_SECRET: "{{config.jwt_secret}}"
      APPFLOWY_REDIS_URL: "redis://{{services.redis}}:6379"
      APPFLOWY_DATABASE_URL: "postgres://postgres:IanoieAppflowyPg2024@{{services.postgres}}:5432/appflowy"

    restart: "unless-stopped"

    depends_on:
      - "postgres"
      - "redis"

  appflowy_search:
    image: "appflowyinc/appflowy_search"
    tag: "latest"
    internal: true

    environment:
      APPFLOWY_REDIS_URL: "redis://{{services.redis}}:6379"

    ports:
      - container_port: 4002
        host_port: null
        protocol: "tcp"
        expose: false

    volumes:
      - name: "appflowy-search"
        mount_path: "/var/lib/appflowy/keyword_index"
        mode: "rw"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4002' || exit 1"]
      interval: 20
      timeout: 10
      retries: 10
      start_period: 40

    restart: "unless-stopped"

    depends_on:
      - "redis"

  admin_frontend:
    image: "appflowyinc/admin_frontend"
    tag: "latest"
    internal: true

    ports:
      - container_port: 3000
        host_port: null
        protocol: "tcp"
        expose: false

    restart: "unless-stopped"

  appflowy_cloud:
    image: "appflowyinc/appflowy_cloud"
    tag: "latest"
    internal: false

    environment:
      APPFLOWY_GOTRUE_JWT_SECRET: "{{config.jwt_secret}}"
      APPFLOWY_BASE_URL: "{{config.base_url}}"
      APPFLOWY_DATABASE_URL: "postgres://postgres:IanoieAppflowyPg2024@{{services.postgres}}:5432/appflowy"
      APPFLOWY_REDIS_URL: "redis://{{services.redis}}:6379"
      APPFLOWY_GOTRUE_URL: "http://{{services.gotrue}}:9999"
      APPFLOWY_AI_SERVER_HOST: "http://{{services.ai}}:5001"
      AWS_ACCESS_KEY: "minioadmin"
      AWS_SECRET_KEY: "IanoieMinio2024"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: "http://{{services.minio}}:9000"

    ports:
      - container_port: 8000
        host_port: null
        protocol: "tcp"
        expose: true

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 20
      timeout: 10
      retries: 15
      start_period: 90

    restart: "unless-stopped"

    depends_on:
      - "postgres"
      - "redis"
      - "gotrue"
      - "minio"
