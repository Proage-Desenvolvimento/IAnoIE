$schema: "ianoie-template/v1"

metadata:
  name: "JupyterLab"
  slug: "jupyterlab"
  version: "1.0.0"
  description: "Interactive notebook environment with optional GPU support"
  category: "notebook"
  icon: "BookOpen"
  tags: ["notebook", "jupyter", "datascience"]

gpu:
  required: false
  min_count: 0
  max_count: 4
  min_vram_gb: 0

llm:
  supported_providers: ["openai", "gemini", "anthropic", "ollama"]
  connection_env:
    openai:
      OPENAI_API_KEY: "{{llm.api_key}}"
      OPENAI_BASE_URL: "{{llm.base_url}}"
      OPENAI_MODEL: "{{llm.model}}"
    gemini:
      GOOGLE_API_KEY: "{{llm.api_key}}"
      GEMINI_MODEL: "{{llm.model}}"
    anthropic:
      ANTHROPIC_API_KEY: "{{llm.api_key}}"
      ANTHROPIC_MODEL: "{{llm.model}}"
    ollama:
      OLLAMA_BASE_URL: "{{llm.base_url}}"
      OLLAMA_MODEL: "{{llm.model}}"

config:
  - key: "password"
    label: "Jupyter Password"
    type: "string"
    default: "ianoie"
    required: true
    description: "Password for JupyterLab access"

services:
  jupyterlab:
    image: "jupyter/tensorflow-notebook"
    tag: "latest"
    internal: false

    environment:
      JUPYTER_TOKEN: "{{config.password}}"
      JUPYTER_ENABLE_LAB: "yes"

    ports:
      - container_port: 8888
        host_port: null
        protocol: "tcp"
        expose: true

    volumes:
      - name: "jupyter-work"
        mount_path: "/home/jovyan/work"
        mode: "rw"

    gpu:
      enabled: true
      count: 1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 30
      timeout: 10
      retries: 3
      start_period: 60

    restart: "unless-stopped"
