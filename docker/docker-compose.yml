services:
  postgres:
    image: postgres:16-alpine
    container_name: ianoie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ianoie
      POSTGRES_PASSWORD: ianoie
      POSTGRES_DB: ianoie
    volumes:
      - ianoie-postgres:/var/lib/postgresql/data
    networks:
      - ianoie-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ianoie"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: ianoie-redis
    restart: unless-stopped
    volumes:
      - ianoie-redis:/data
    networks:
      - ianoie-proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ianoie-api
    restart: unless-stopped
    pid: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - ../templates:/app/templates:ro,z
    environment:
      - DATABASE_URL=postgresql+asyncpg://ianoie:ianoie@postgres:5432/ianoie
      - DATABASE_URL_SYNC=postgresql+psycopg2://ianoie:ianoie@postgres:5432/ianoie
      - DOCKER_HOST=unix:///var/run/docker.sock
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - TEMPLATES_DIR=/app/templates
    env_file:
      - ../.env
    networks:
      - ianoie-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ianoie-api.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.ianoie-api.entrypoints=web"
      - "traefik.http.services.ianoie-api.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health does a SELECT 1, so this catches both a wedged event loop and
      # an unreachable DB. Docker then restarts the container (restart: unless-stopped).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ianoie-worker
    restart: unless-stopped
    pid: "host"
    command:
      [
        "celery",
        "-A",
        "ianoie.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - ../templates:/app/templates:ro,z
    environment:
      - DATABASE_URL=postgresql+asyncpg://ianoie:ianoie@postgres:5432/ianoie
      - DATABASE_URL_SYNC=postgresql+psycopg2://ianoie:ianoie@postgres:5432/ianoie
      - DOCKER_HOST=unix:///var/run/docker.sock
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - TEMPLATES_DIR=/app/templates
    env_file:
      - ../.env
    networks:
      - ianoie-proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `celery inspect ping` exits 0 even with no responders, so grep for "pong".
      # If the worker is wedged it won't answer -> unhealthy -> Docker restarts it.
      test:
        [
          "CMD-SHELL",
          "celery -A ianoie.workers.celery_app:celery_app inspect ping -t 5 | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ianoie-beat
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "ianoie.workers.celery_app:celery_app",
        "beat",
        "--loglevel=info",
      ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
    environment:
      - DATABASE_URL=postgresql+asyncpg://ianoie:ianoie@postgres:5432/ianoie
      - DATABASE_URL_SYNC=postgresql+psycopg2://ianoie:ianoie@postgres:5432/ianoie
      - DOCKER_HOST=unix:///var/run/docker.sock
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ../.env
    networks:
      - ianoie-proxy
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ianoie-frontend
    restart: unless-stopped
    networks:
      - ianoie-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ianoie-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ianoie-frontend.entrypoints=web"
      - "traefik.http.routers.ianoie-frontend.priority=1"
      - "traefik.http.services.ianoie-frontend.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  traefik:
    image: traefik:v3.6
    container_name: ianoie-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=ianoie-proxy"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8888:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    networks:
      - ianoie-proxy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  ianoie-postgres:
  ianoie-redis:

networks:
  ianoie-proxy:
    external: true
